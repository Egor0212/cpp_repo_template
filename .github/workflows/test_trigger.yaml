name: Tests Trigger

on:
  pull_request_target:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Detect task from branch
        id: detect
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^submits/(.+)$ ]]; then
            echo "task=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "Not a submit branch"
            exit 1
          fi

      - name: Emit repository_dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: Egor0212/private
          event-type: grade_submission
          client-payload: |-
            {
              "task": "${{ steps.detect.outputs.task }}",
              "pr_number": ${{ github.event.pull_request.number }},
              "student": "${{ github.event.pull_request.user.login }}",
              "public_repo": "${{ github.repository }}",
              "commit_sha": "${{ github.event.pull_request.head.sha }}"
            }

name: CI for project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Configure CMake
      run: cmake -DCMAKE_BUILD_TYPE=ASAN -B build -S .
      
    - name: Build
      run: cd build && make test_multiplication

    - name: Run tests
      run: ./test_multiplication

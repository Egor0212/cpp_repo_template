name: CI for project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check CodeStyle
      run: find -name *.h | xargs clang-format --dry-run -Werror && find -name *.cpp | xargs clang-format --dry-run -Werror
    
    - name: Configure CMake
      run: cmake -DCMAKE_BUILD_TYPE=ASAN -B build -S .
      
    - name: Build
      run: cd build && make test_multiplication

    - name: Run tests
      run: cd build && ./test_multiplication
